name: 🚀 Build & Release StreamHub

on:
  push:
    tags:
      - 'v*.*.*'   # v2.4.0, v2.5.0 etc push karne par automatically trigger hoga

permissions:
  contents: write  # GitHub Release banane ke liye zaruri

jobs:
  build-and-release:
    name: Build EXE + APK and Create GitHub Release
    runs-on: windows-latest

    steps:
      # ── 1. Repo checkout ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ─────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Dependencies install ─────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow qrcode certifi

      # ── 4. Build EXE (VLC bundled) ──────────────────────────────────────────
      - name: Build StreamHub.exe
        run: python build_exe.py
        # Note: VLC must be installed on runner OR vlc_runtime.zip must be pre-committed.
        # Agar vlc_runtime.zip already committed hai toh ye step seedha kaam karega.

      # ── 5. Compute EXE sha256 ───────────────────────────────────────────────
      - name: Compute SHA256 of EXE
        id: sha
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist\StreamHub.exe" -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item "dist\StreamHub.exe").Length
          echo "sha256=$hash" >> $env:GITHUB_OUTPUT
          echo "size=$size"   >> $env:GITHUB_OUTPUT

      # ── 6. Update version.json with real hash + URLs ────────────────────────
      - name: Update version.json
        shell: pwsh
        run: |
          $tag     = "${{ github.ref_name }}"          # e.g. v2.4.0
          $ver     = $tag.TrimStart('v')               # e.g. 2.4.0
          $repo    = "${{ github.repository }}"        # owner/repo
          $sha     = "${{ steps.sha.outputs.sha256 }}"
          $size    = [long]"${{ steps.sha.outputs.size }}"

          # khushal-jangid/streamhub
          $exeUrl  = "https://github.com/$repo/releases/download/$tag/StreamHub.exe"
          $apkUrl  = "https://github.com/$repo/releases/download/$tag/StreamHub.apk"

          $json = [ordered]@{
            version          = $ver
            download_url     = $exeUrl
            apk_download_url = $apkUrl
            sha256           = $sha
            size_bytes       = $size
            notes            = "StreamHub v$ver — New release with latest features & fixes."
          }
          $json | ConvertTo-Json -Depth 3 | Set-Content dist\version.json -Encoding UTF8
          Write-Host "version.json updated for $ver"

      # ── 7. APK — use existing StreamHub.apk ─────────────────────────────────
      # (Jab tak Android build pipeline na bane, pre-built APK use hoga)
      - name: Verify APK exists
        shell: pwsh
        run: |
          if (Test-Path "StreamHub.apk") {
            Write-Host "APK found: $(Get-Item StreamHub.apk | Select -Expand Length) bytes"
          } else {
            Write-Warning "StreamHub.apk not found — release will only have EXE"
          }

      # ── 8. Create GitHub Release & upload assets ────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "StreamHub ${{ github.ref_name }}"
          body: |
            ## 🎬 StreamHub ${{ github.ref_name }}

            ### Download
            | Platform | File |
            |----------|------|
            | 🖥️ Windows PC | `StreamHub.exe` |
            | 📱 Android Phone | `StreamHub.apk` |

            ### How to Update
            - **PC**: App ke andar Settings → "Check for Updates" → 1-click install
            - **Android**: `StreamHub.apk` download kar ke install kar lo
          files: |
            dist/StreamHub.exe
            dist/version.json
            StreamHub.apk
          draft: false
          prerelease: false
